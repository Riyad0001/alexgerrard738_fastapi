version: "3.8"

services:
  api:
    build: .
    container_name: key_matching_agent
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_network

  postgres:
    image: postgres:16-alpine
    container_name: key_matching_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-key_matching}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-key_matching}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

volumes:
  postgres_data:

networks:
  internal_network:
    driver: bridge

